name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dance_trainer_vue
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Dance_trainer_vue/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: Dance_trainer_vue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages deploy agent occasionally loses a race and fails a single
      # attempt. Retry a few times with a back-off before giving up.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry deployment (attempt 2)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry_2
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        run: sleep 30

      - name: Retry deployment (attempt 3)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        id: deployment_retry_3
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Report deploy failure
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure' && steps.deployment_retry_3.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages deployment failed after 3 attempts (likely the deploy-agent race condition)."
          exit 1
